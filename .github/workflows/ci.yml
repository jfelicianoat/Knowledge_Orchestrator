name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    # Sólo Windows: la interfaz es de escritorio y en Linux haría falta pantalla virtual.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        if: ${{ !cancelled() }}
        run: python -m ruff check .
      - name: Tipos
        if: ${{ !cancelled() }}
        run: python -m mypy
      - name: Tests
        if: ${{ !cancelled() }}
        run: python -m pytest -q
